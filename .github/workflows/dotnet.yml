name: .NET CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        dotnet: ['10.0.x']

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_XMLDOC_MODE: skip

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          extra_args: --only-verified

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/v3-cache
          key: ${{ runner.os }}-nuget-${{ matrix.dotnet }}-${{ hashFiles('**/*.sln', '**/*.csproj', '**/*.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ matrix.dotnet }}-
            ${{ runner.os }}-nuget-

      - name: Restore
        run: >-
          dotnet restore MQTTnet.Extensions.ManagedClient.Routing.sln
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=moderate
          -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Diagnostics
        if: always()
        run: |
          echo "CI=$CI"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          git rev-parse HEAD
          dotnet --info

      - name: Build
        run: dotnet build MQTTnet.Extensions.ManagedClient.Routing.sln --no-restore --configuration Release

      - name: Test (with coverage)
        run: |
          dotnet test MQTTnet.Extensions.ManagedClient.Routing.sln --no-build --configuration Release \
            --logger "trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Generate Coverage Summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: ./TestResults/**/coverage.cobertura.xml
          badge: true
          format: markdown
          hide_complexity: true
          output: both

      - name: Publish Coverage Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Run sample (smoke test)
        timeout-minutes: 5
        run: dotnet run --project Samples/MqttRoutingSample --no-build --configuration Release
